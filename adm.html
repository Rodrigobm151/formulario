<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - SRS-2</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            background: #fff;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a365d;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }
        .btn-box {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        button {
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-refresh { background-color: #4a5568; }
        .btn-refresh:hover { background-color: #2d3748; }
        .btn-excel { background-color: #2f855a; }
        .btn-excel:hover { background-color: #22543d; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }
        th {
            background-color: #ebf8ff;
            color: #2b6cb0;
            font-weight: bold;
        }
        tr:hover { background-color: #f7fafc; }
        .loading {
            text-align: center;
            font-style: italic;
            color: #718096;
            padding: 20px;
        }
        .action-btn {
            background-color: #3182ce;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 3px;
        }
        .action-btn:hover { background-color: #2b6cb0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Painel de Controle - Respostas do SRS-2</h1>

    <div class="btn-box">
        <button class="btn-refresh" id="btnCarregar">🔄 Atualizar Dados</button>
        <button class="btn-excel" id="btnExportarTudo">📥 Exportar Tudo para Excel</button>
    </div>

    <div id="status" class="loading">Buscando registros...</div>

    <table id="tabelaRespostas" style="display: none;">
        <thead>
            <tr>
                <th>Data do Envio</th>
                <th>Nome do Avaliado</th>
                <th>Data Nasc.</th>
                <th>Sexo</th>
                <th>Respondente (Grau)</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpoTabela">
            </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Configurações do seu projeto: transporte-fds
    const firebaseConfig = {
        apiKey: "AIzaSyCocyGvi4Si0Mdfdg2CtZuw_7FmFqAwTX4",
        authDomain: "transporte-fds.firebaseapp.com",
        projectId: "transporte-fds",
        storageBucket: "transporte-fds.firebasestorage.app",
        messagingSenderId: "489507277792",
        appId: "1:489507277792:web:b40b649f7a789499a27985",
        measurementId: "G-PEB2TCWF5X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    let dadosLocais = [];

    // Matriz com os textos exatos das perguntas para mapear no Excel
    const perguntasTexto = [
        "Parece muito mais desconfortável em situações sociais do que quando está sozinha.",
        "As expressões em seu rosto não combinam com o que está dizendo.",
        "Parece confiante (ou segura) quando está interagindo com outras pessoas.",
        "Quando há sobrecarga de estímulos, apresenta padrões rígidos e inflexíveis de comportamento, aparentemente estranhos.",
        "Não percebe quando os outros estão tentando tirar vantagem dela.",
        "Prefere estar sozinha do que com os outros.",
        "Demonstra perceber o que os outros estão pensando ou sentindo.",
        "Se comporta de maneira estranha ou bizarra.",
        "Precisa da ajuda de outras pessoas para satisfazer suas necessidades básicas.",
        "Leva as coisas muito \"ao pé da letra\" e não compreende o real significado de uma conversa.",
        "É autoconfiante.",
        "É capaz de comunicar seus sentimentos para as outras pessoas.",
        "É estranha na \"tomada de vez\" das interações com seus colegas (por exemplo, não parece entender a reciprocidade de uma conversa).",
        "Não tem boa coordenação.",
        "Reconhece e responde de forma apropriada às mudanças no tom de voz e expressões faciais de outras pessoas.",
        "Evita o contato visual ou tem contato visual diferente.",
        "Reconhece quando algo é injusto.",
        "Tem dificuldade em fazer amigos, mesmo tentando dar o melhor de si.",
        "Fica frustrada tentando expressar suas ideias em uma conversa.",
        "Mostra interesses sensoriais incomuns (por exemplo, cheirar seus dedos com frequência) ou estranhos, chacoalha repetidamente pequenos itens.",
        "É capaz de imitar ações e comportamento de outras pessoas quando é socialmente apropriado fazê-lo.",
        "Interage apropriadamente com outros adultos.",
        "Não participa de atividades em grupo e eventos sociais a menos que seja convidada a fazê-lo.",
        "Tem mais dificuldade do que outras pessoas com mudanças em sua rotina.",
        "Não parece se importar em estar fora de sintonia ou em um \"mundo\" diferente dos outros.",
        "Oferece conforto para os outros quando estão tristes.",
        "Evita iniciar interações sociais com outros adultos.",
        "Pensa ou fala sobre a mesma coisa repetidamente.",
        "É considerada estranha ou esquisita pelas outras pessoas.",
        "Fica perturbada em uma situação com muitas coisas acontecendo.",
        "Não consegue tirar algo da sua mente uma vez que começa a pensar sobre isso.",
        "Tem boa higiene pessoal.",
        "É socialmente desajeitada, mesmo quando tenta ser educada.",
        "Evita pessoas que querem se aproximar dela por meio de contato afetivo.",
        "Tem dificuldade em acompanhar o fluxo de uma conversa normal.",
        "Tem dificuldade em se relacionar com os membros da família.",
        "Tem dificuldade em se relacionar com adults.",
        "Responde adequadamente às mudanças de humor das outras pessoas (por exemplo, quando o humor de um amigo muda de feliz para triste).",
        "Tem uma variedade de interesses extraordinariamente incomuns.",
        "É imaginativa sem perder contato com a realidade.",
        "Muda de uma atividade para outra sem objetivo aparente.",
        "Parece excessivamente sensível aos sons, texturas ou cheiros.",
        "Gosta de se mostrar \"boa de conversa\" (conversa informal com os outros).",
        "Não entende como os acontecimentos estão relacionados entre si (causa e efeito), da mesma forma que outros adultos.",
        "Geralmente fica interessada no que as pessoas próximas estão prestando atenção.",
        "Tem expressão facial excessivamente séria.",
        "Ri em momentos inapropriados.",
        "Tem senso de humor e entende as piadas.",
        "É extremamente hábil em tarefas intelectuais ou computacionais, mas não consegue fazer tão bem a maioria das outras tarefas.",
        "Têm comportamentos estranhos e repetitivos.",
        "Tem dificuldade em responder perguntas diretamente e acaba falando em torno do assunto.",
        "Sabe quando está falando muito alto ou fazendo muito barulho.",
        "Fala com as pessoas com um tom de voz incomum (por exemplo, fala como um robô ou como se estivesse dando uma palestra).",
        "Parece agir com as pessoas como se elas fossem objetos.",
        "Sabe quando está muito próxima ou invadindo o espaço de alguém.",
        "Caminha entre duas pessoas que estão conversando.",
        "Isolada; tende a não deixar sua casa.",
        "Concentra-se demais em partes das coisas ao invés de ver o todo.",
        "É excessivamente desconfiada.",
        "É emocionalmente distante, não demonstrando seus sentimentos.",
        "É inflexível e tem dificuldade para mudar de ideia.",
        "Dá explicações incomuns ou ilógicas do porquê de fazer as coisas.",
        "Toca ou cumprimenta os outros de uma maneira incomum.",
        "Fica muito agitada em situações sociais.",
        "Fica com olhar perdido ou olha fixamente para o nada."
    ];

    const btnCarregar = document.getElementById('btnCarregar');
    const btnExportarTudo = document.getElementById('btnExportarTudo');
    const status = document.getElementById('status');
    const tabela = document.getElementById('tabelaRespostas');
    const corpoTabela = document.getElementById('corpoTabela');

    async function puxarDados() {
        status.style.display = "block";
        status.innerText = "Buscando dados no Firebase...";
        tabela.style.display = "none";
        corpoTabela.innerHTML = "";
        dadosLocais = [];

        try {
            const q = query(collection(db, "respostas_srs2"));
            const querySnapshot = await getDocs(q);
            
            if (querySnapshot.empty) {
                status.innerText = "Nenhum formulário encontrado no banco de dados.";
                return;
            }

            querySnapshot.forEach((doc) => {
                const item = doc.data();
                item.id = doc.id;
                dadosLocais.push(item);

                const dataFormatada = item.enviadoEm ? new Date(item.enviadoEm).toLocaleString('pt-BR') : 'N/A';
                const dataNascFmt = item.dataNascimento ? item.dataNascimento.split('-').reverse().join('/') : 'N/A';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${dataFormatada}</td>
                    <td><strong>${item.nomeAvaliado || 'Sem Nome'}</strong></td>
                    <td>${dataNascFmt}</td>
                    <td>${item.sexo || '-'}</td>
                    <td>${item.nomeRespondente || '-'} (${item.relacao || '-'})</td>
                    <td>
                        <button class="action-btn" data-id="${item.id}">Baixar este Excel</button>
                    </td>
                `;
                corpoTabela.appendChild(tr);
            });

            dadosLocais.sort((a, b) => new Date(b.enviadoEm) - new Date(a.enviadoEm));

            status.style.display = "none";
            tabela.style.display = "table";

            document.querySelectorAll('.action-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    baixarExcelIndividual(id);
                });
            });

        } catch (error) {
            console.error("Erro ao buscar dados:", error);
            status.innerText = "Erro de conexão ou permissão negada no Firebase.";
        }
    }

    // Exportação de 1 Paciente (Vertical) com o texto completo da pergunta
    function baixarExcelIndividual(id) {
        const paciente = dadosLocais.find(d => d.id === id);
        if (!paciente) return;

        const estrutura = [
            ["MÉTRICA / IDENTIFICAÇÃO", "VALOR"],
            ["Nome do Avaliado", paciente.nomeAvaliado],
            ["Data de Nascimento", paciente.dataNascimento],
            ["Data da Avaliação", paciente.dataAvaliacao],
            ["Sexo", paciente.sexo],
            ["Nome do Respondente", paciente.nomeRespondente],
            ["Relação", paciente.relacao],
            ["Enviado via Web em", paciente.enviadoEm],
            [], 
            ["PERGUNTA / ITEM", "RESPOSTA (1 a 4)"]
        ];

        // Mapeia o texto da pergunta em vez de "Item X"
        perguntasTexto.forEach((textoPergunta, index) => {
            const itemNum = index + 1;
            const respostaVal = paciente.respostas ? paciente.respostas[`item_${itemNum}`] : "N/A";
            estrutura.push([`${itemNum}. ${textoPergunta}`, respostaVal]);
        });

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(estrutura);
        // Alarga a primeira coluna para que o texto da pergunta não fique cortado
        ws['!cols'] = [{ wch: 100 }, { wch: 20 }];
        XLSX.utils.book_append_sheet(wb, ws, "Resultado SRS-2");
        XLSX.writeFile(wb, `SRS2_${paciente.nomeAvaliado.replace(/\s+/g, '_')}.xlsx`);
    }

    // Exportação Geral (Horizontal) com o texto completo da pergunta no cabeçalho
    function exportarTudoParaExcel() {
        if (dadosLocais.length === 0) {
            alert("Não há dados carregados para exportar.");
            return;
        }

        // Cabeçalho dinâmico contendo as informações e os textos das 65 perguntas
        const cabecalho = ["Nome do Avaliado", "Data Nasc.", "Data Avaliação", "Sexo", "Respondente", "Relação", "Data Envio"];
        perguntasTexto.forEach((textoPergunta, index) => {
            cabecalho.push(`${index + 1}. ${textoPergunta}`);
        });

        const matrizExcel = [cabecalho];

        dadosLocais.forEach(p => {
            const linha = [
                p.nomeAvaliado,
                p.dataNascimento,
                p.dataAvaliacao,
                p.sexo,
                p.nomeRespondente,
                p.relacao,
                p.enviadoEm
            ];
            for (let i = 1; i <= 65; i++) {
                linha.push(p.respostas ? p.respostas[`item_${i}`] : "");
            }
            matrizExcel.push(linha);
        });

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(matrizExcel);
        XLSX.utils.book_append_sheet(wb, ws, "Consolidado Geral");
        XLSX.writeFile(wb, "SRS2_Banco_De_Dados_Geral.xlsx");
    }

    btnCarregar.addEventListener('click', puxarDados);
    btnExportarTudo.addEventListener('click', exportarTudoParaExcel);

    puxarDados();
</script>

</body>
</html>
